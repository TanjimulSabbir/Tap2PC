<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jora PC | Remote Control</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/status.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/system.info.css">
    <link rel="stylesheet" href="/css/feedback.css">
    <link rel="stylesheet" href="/css/confirmation.modal.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@600;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div class="app-container">

        <header class="status-container">
            <div class="status-card">
                <div class="brand-group">
                    <h1 class="logo">Jora <span>PC</span></h1>
                    <p id="pcName" class="device-id">HP-ELITEBOOK-840-G3</p>
                    <div class="badge-wrapper">
                        <span class="neon-pill">
                            <span class="pulse-dot"></span> Online
                        </span>
                    </div>
                </div>

                <div class="glass-panel">
                    <div id="currentTime" class="clock">09:24 PM</div>
                    <div id="battery-info" class="battery-info">
                        <i class="fas fa-bolt"></i>
                        <p class="percentage">85%</p>
                    </div>
                </div>
            </div>
        </header>
        <!-- ACTION GRID -->
        <section class="grid-container">

            <button class="action-card shutdown" data-action="shutdown">
                <i class="fas fa-power-off"></i>
                <span>Shutdown</span>
            </button>

            <button class="action-card restart" data-action="restart">
                <i class="fas fa-sync-alt"></i>
                <span>Restart</span>
            </button>

            <button class="action-card sleep" data-action="sleep">
                <i class="fas fa-bed"></i>
                <span>Sleep</span>
            </button>

            <button class="action-card lock" data-action="lock">
                <i class="fas fa-lock"></i>
                <span>Lock</span>
            </button>

            <button class="action-card success" data-action="screen-on">
                <i class="fas fa-sun"></i>
                <span>Screen On</span>
            </button>

            <button class="action-card status" data-action="system-info">
                <i class="fas fa-desktop"></i>
                <span>System Info</span>
            </button>

        </section>

        <!-- SYSTEM Information -->
        <section>
            <!-- SYSTEM OVERLAY -->
            <div id="statusPage" class="overlay-page">
                <div class="overlay-header">
                    <button class="back-btn" onclick="closeStatus()">
                        <i class="fas fa-chevron-left"></i> Back
                    </button>
                    <h2>System Monitor</h2>
                </div>

                <div class="status-content">
                    <div class="stat-detail-card">
                        <div class="stat-icon cpu"><i class="fas fa-microchip"></i></div>
                        <div class="stat-info">
                            <label>CPU Usage</label>
                            <div class="stat-row">
                                <span class="value">42%</span>
                                <span class="temp">48°C</span>
                            </div>
                            <div class="mini-progress">
                                <div class="bar" style="width: 42%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FILE SECTION -->
            <section class="file-section">
                <h3><i class="fas fa-share-nodes"></i> File Management</h3>

                <div class="file-actions">
                    <div class="transfer-card">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <div>
                            <h4>Send Files</h4>
                            <p>Transfer to PC</p>
                        </div>
                    </div>

                    <div class="transfer-card">
                        <i class="fas fa-cloud-download-alt"></i>
                        <div>
                            <h4>Received</h4>
                            <p>Downloads from PC</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- STORAGE -->
            <section class="storage-info">
                <div class="storage-bar-header">
                    <span>Storage (C:)</span>
                    <span>120GB / 500GB</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" style="width: 24%;"></div>
                </div>
            </section>
        </section>

        <!-- ✅ FIXED MODAL (IMPORTANT PART) -->
        <div class="modal-overlay" id="confirmModal">

            <div class="modal-content">
                <div class="modal-glow"></div>

                <div class="modal-header">
                    <div class="modal-icon-hex">
                        <i id="modalIcon" class="fas fa-circle-notch fa-spin"></i>
                    </div>

                    <h2 id="modalTitle">Processing...</h2>
                </div>

                <div class="modal-body">
                    <p id="modalMessage">Executing...</p>
                </div>

                <div class="modal-footer">
                    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button class="btn-confirm" id="confirmBtn">Confirm</button>
                </div>

            </div>
        </div>

        <!-- Feedback Modal System -->
        <div id="feedbackModal" class="feedback-overlay">

            <div class="feedback-card">

                <!-- Icon -->
                <div id="feedbackModalIcon" class="status-icon-wrapper">
                    <i class="fas fa-circle-notch fa-spin"></i>
                </div>

                <!-- Text -->
                <h3 id="feedbackModalTitle">Requesting...</h3>
                <p id="feedbackModalMessage">Connecting to JoraPC server.</p>

                <!-- Error-only button -->
                <button id="feedbackModalCloseBtn" class="close-modal-btn" onclick="closeFeedback()"
                    style="display:none;">
                    Dismiss
                </button>

            </div>

        </div>
    </div>

    <div id="system-info-container"></div>

    <script type="module" src="/javascript/app.js"></script>

</body>

</html>
